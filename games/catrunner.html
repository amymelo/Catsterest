<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Miau Runner Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            background-color: #0a0a0a;
            display: flex; 
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 0;
            transition: background-color 1s;
        }

        .topo-title {
            font-size: 2rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            background: linear-gradient(#fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            margin-bottom: auto;
            padding-top: 60px
        }

        #game-container {
            width: 95%;
            max-width: 600px;
            height: 300px;
            background: #111; 
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid #333;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 180px;
        }

        /* Gato */
        #cat {
            width: 45px;
            height: 45px;
            position: absolute; 
            left: 50px; 
            bottom: 20px;
            font-size: 38px; 
            color: #F4893F;
            display: flex; 
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: transform 0.1s, height 0.1s;
        }

        /* Estado >AGACHADO< */
        #cat.ducking {
            height: 25px;
            font-size: 30px;
            transform: scaleY(0.6);
        }

        .obstacle {
            position: absolute;
            font-size: 24px;
            z-index: 4;
        }

        .hud {
            position: absolute; 
            top: 20px;
            left: 0; 
            width: 100%;
            padding: 0 25px; 
            display: flex;
            justify-content: space-between;
            z-index: 10;
        }
        .score-box { 
            font-family: monospace;
            font-size: 18px; 
        }
    
        .score-box span { 
            color: #777;
            font-size: 10px; 
            display: block; 
            text-transform: uppercase; 
        }

        /* area de comando pular e abaixar */
        .controls-area {
            width: 100%; 
            max-width: 600px; 
            height: 120px;
            display: flex; 
            gap: 15px;
            padding: 10px;
            margin-bottom: 30px;
        }
        .btn-control {
            flex: 1; 
            background: #1a1a1a; 
            border: 1px solid #333;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            color: #555;
            cursor: pointer; 
            active { background: #222; 
            transform: scale(0.98);}
        }
    
        .btn-control i { 
            font-size: 24px; 
            margin-bottom: 5px; 
        }

        #message {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: none; 
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            z-index: 100;
            backdrop-filter: blur(4px);
        }

        button.restart-btn {
            margin-top: 20px; 
            padding: 12px 32px;
            background: #fff;
            color: #000; 
            border: none;
            border-radius: 12px; 
            font-weight: bold;
        }

        .ground {
            position: absolute; 
            bottom: 0; 
            width: 100%;
            height: 20px;
            background: #222;
        }
    
    </style>
</head>
<body>

    <h1 class="topo-title">MIAU RUNNER</h1>

    <div id="game-container">
        <div class="hud">
            <div class="score-box"><span>Record</span><div id="high-score">00000</div></div>
            <div class="score-box"><span>Score</span><div id="score">00000</div></div>
        </div>
        
        <div id="cat"><i class="fa-solid fa-cat"></i></div>
        <div class="ground"></div>
        
        <div id="message">
            <h2 id="msg-title">GAME OVER</h2>
            <p id="final-points" style="color: #777;"></p>
            <button class="restart-btn" onclick="resetGame()">RECOMEÇAR</button>
        </div>
    </div>

    <div class="controls-area">
        <div class="btn-control" onmousedown="handleJump()" ontouchstart="handleJump()">
            <i class="fa-solid fa-arrow-up"></i>
            <span>PULAR</span>
        </div>
        <div class="btn-control" onmousedown="startDuck()" onmouseup="stopDuck()" ontouchstart="startDuck()" ontouchend="stopDuck()">
            <i class="fa-solid fa-arrow-down"></i>
            <span>ABAIXAR</span>
        </div>
    </div>

    <script>
        const cat = document.getElementById("cat");
        const scoreDisplay = document.getElementById("score");
        const hiDisplay = document.getElementById("high-score");
        const container = document.getElementById("game-container");
        const messageBox = document.getElementById("message");

        let score = 0;
        let highscore = localStorage.getItem("miau_runner_hi") || 0;
        let isGameOver = false;
        let isDucking = false;
        
        let posY = 20;
        let velocityY = 0;
        let gravity = 0.8;
        let jumpForce = 12;
        let jumpsLeft = 2;

        hiDisplay.innerText = highscore.toString().padStart(5, '0');

        function handleJump() {
            if (isGameOver || isDucking) return;
            if (jumpsLeft > 0) {
                velocityY = jumpForce;
                jumpsLeft--;
                cat.style.transform = `rotate(-${jumpsLeft * 10}deg)`;
            }
        }

        function startDuck() { 
            if(posY <= 21 && !isGameOver) {
                isDucking = true; 
                cat.classList.add("ducking"); 
            }
        }
        function stopDuck() { 
            isDucking = false; 
            cat.classList.remove("ducking"); 
        }

        function updatePhysics() {
            if (isGameOver) return;

            velocityY -= gravity;
            posY += velocityY;

            if (posY <= 20) {
                posY = 20;
                velocityY = 0;
                jumpsLeft = 2;
                if(!isDucking) cat.style.transform = "rotate(0deg)";
            }

            cat.style.bottom = posY + "px";
            
              // Lógica de Cores por Level (Evolução Visual)
                if (score >= 2000) {
                    document.body.style.backgroundColor = "#1a0a1a"; // roxo escuro
                } 
                else if (score >= 1500) {
                    document.body.style.backgroundColor = "#0a0a1a"; // azul escuro                    
                }
                else if (score >= 1000) {
                    document.body.style.backgroundColor = "#0a1a0a"; // verde escuro
                } 
                else if (score >= 500) {
                    document.body.style.backgroundColor = "#1a1a00"; // amarelo velho
                } 
                else if (score >= 250) {
                    document.body.style.backgroundColor = "#1a0a00"; // laranja queimaso
                }
                else if (score >= 100) {
                    document.body.style.backgroundColor = "#000a1a"; // azul noite
                } 
                else if (score >= 50) {
                    document.body.style.backgroundColor = "#0f0f0f"; // grafite
                }
                else {
                    document.body.style.backgroundColor = "#0a0a0a"; // Fundo Original
                }
                requestAnimationFrame(updatePhysics);
        }

        function createObstacle() {
            if (isGameOver) return;

            const obstacle = document.createElement("div");
            obstacle.classList.add("obstacle");
            
            // Variação: Obstáculo no chão ou voador
            const isAir = Math.random() > 0.7 && score > 300;
            obstacle.style.bottom = isAir ? "70px" : "20px";
            obstacle.innerHTML = isAir ? '<i class="fa-solid fa-dove"></i>' : '<i class="fa-solid fa-dog"></i>';
            obstacle.style.color = isAir ? "#4da6ff" : "#7D2B1D";
            
            container.appendChild(obstacle);

            let posX = 600;
            let speed = 6 + (score / 250);

            function move() {
                if (isGameOver) { obstacle.remove(); return; }
                posX -= speed;
                obstacle.style.left = posX + "px";

                // Colisão (Ajustada para agachamento)
                const catRect = cat.getBoundingClientRect();
                const obsRect = obstacle.getBoundingClientRect();

                if (
                    catRect.right > obsRect.left + 10 && 
                    catRect.left < obsRect.right - 10 &&
                    catRect.bottom > obsRect.top + 5 &&
                    catRect.top < obsRect.bottom - 5
                ) {
                    gameOver();
                }

                if (posX < -50) {
                    obstacle.remove();
                    score += 10;
                    scoreDisplay.innerText = score.toString().padStart(5, '0');
                } else {
                    requestAnimationFrame(move);
                }
            }
            requestAnimationFrame(move);

            setTimeout(createObstacle, Math.random() * (1500 - 700) + 700);
        }

        function gameOver() {
            isGameOver = true;
            messageBox.style.display = "flex";
            document.getElementById("final-points").innerText = `Score Final: ${score}`;
            if (score > highscore) {
                localStorage.setItem("miau_runner_hi", score);
                hiDisplay.innerText = score.toString().padStart(5, '0');
            }
        }

        function resetGame() {
            location.reload(); // limpa e resetar tudo
        }

        // compatibilidade com teclado de pc (Seta Cima / Seta Baixo)
        window.addEventListener("keydown", (e) => {
            if(e.code === "ArrowUp" || e.code === "Space") handleJump();
            if(e.code === "ArrowDown") startDuck();
        });
        window.addEventListener("keyup", (e) => {
            if(e.code === "ArrowDown") stopDuck();
        });

        updatePhysics();
        createObstacle();
    </script>
</body>
</html>
