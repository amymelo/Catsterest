<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<title>Catsterest - Resultados</title>

<style>
/* --- ESTILOS TEMA DARK --- */
body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, sans-serif;
  background: #0f0f0f;
  color: white;
  padding-bottom: 120px;
}

/* --- BARRA DE BUSCA (ESTILO RESULTADO) --- */
.search-header {
  position: sticky;
  top: 0;
  background: #0f0f0f;
  padding: 15px;
  z-index: 2500;
  display: flex;
  align-items: center;
  gap: 15px;
  padding-top: 30px;
}

.search-box {
  flex: 1;
  background: #262626;
  height: 45px;
  border-radius: 25px;
  display: flex;
  align-items: center;
  padding: 0 15px;
}

.search-box input {
  background: transparent;
  border: none;
  color: white;
  width: 100%;
  font-size: 16px;
  outline: none;
  margin-left: 10px;
  pointer-events: none;
}

.search-box i { color: #767676; }

/* --- CATEGORIAS (CHIPS) --- */
.chips-container {
  display: flex;
  overflow-x: auto;
  padding: 5px 15px 15px;
  gap: 8px;
  scrollbar-width: none;
}
.chips-container::-webkit-scrollbar { display: none; }

.chip {
  background: #262626;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
}

/* --- PASTAS EM DESTAQUE --- */
.section-title {
  padding: 10px 15px;
  font-size: 18px;
  font-weight: bold;
}

.pastas-container {
  display: flex;
  gap: 10px;
  padding: 0 15px 20px;
  overflow-x: auto;
  scrollbar-width: none;
}

.pasta-card { min-width: 200px; flex: 1; }

.pasta-grid-thumb {
  display: grid;
  grid-template-columns: 2fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 2px;
  height: 120px;
  border-radius: 12px;
  overflow: hidden;
  background: #1a1a1a;
}

.pasta-grid-thumb img { width: 100%; height: 100%; object-fit: cover; }
.img-main { grid-row: span 2; }

.pasta-info { padding: 5px 0; }
.pasta-info h4 { font-size: 14px; margin: 0; }
.pasta-info p { font-size: 11px; color: #767676; margin: 2px 0; }

/* --- CONTAINER MASONRY --- */
.container {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
  max-width: 1200px;
  margin: 0 auto;
}

.coluna { flex: 1; display: flex; flex-direction: column; gap: 10px; }

.card { border-radius: 14px; overflow: hidden; background: #1a1a1a; }
.card img { width: 100%; display: block; opacity: 0; transition: 0.5s; }

/* --- NAVBAR MOBILE (ESTILO EXPLORAR) --- */
.mobile-navbar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 400px;
  height: 65px;
  background-color: rgba(26, 26, 26, 0.95);
  backdrop-filter: blur(15px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-radius: 35px;
  z-index: 2000;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.nav-item { color: #767676; font-size: 22px; cursor: pointer; }
.nav-item.active { color: white; }

.profile-pic-small { 
  width: 28px; 
  height: 28px; 
  border-radius: 50%; 
  overflow: hidden; 
}
.profile-pic-small img { width: 100%; height: 100%; object-fit: cover; }

@media (max-width: 600px) { .coluna:nth-child(4), .coluna:nth-child(3) { display: none; } }
</style>
</head>
<body>

<div class="search-header">
  <i class="fa-solid fa-chevron-left" onclick="location.href='explorar.html'" style="color: white; cursor: pointer; font-size: 20px;"></i>
  <div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="inputResultado" value="Gatinhos fofos" readonly>
    <i class="fa-solid fa-sliders"></i>
  </div>
</div>

<div class="chips-container">
  <div class="chip" style="background: #e60023;">Gatinhos</div>
  <div class="chip">Memes de gatos</div>
  <div class="chip">Desenho de gatos</div>
  <div class="chip">Filhotes de gatos</div>
</div>

<div class="section-title">Explore as pastas em destaque</div>

<div class="pastas-container">
  <div class="pasta-card">
    <div class="pasta-grid-thumb">
      <img src="https://cataas.com/cat?1" class="img-main">
      <img src="https://cataas.com/cat?2">
      <img src="https://cataas.com/cat?3">
    </div>
    <div class="pasta-info">
      <h4>Cat memes</h4>
      <p>Pop Culture <i class="fa-solid fa-circle-check" style="color: #e60023; font-size: 10px;"></i></p>
    </div>
  </div>
  <div class="pasta-card">
    <div class="pasta-grid-thumb">
      <img src="https://cataas.com/cat?4" class="img-main">
      <img src="https://cataas.com/cat?5">
      <img src="https://cataas.com/cat?6">
    </div>
    <div class="pasta-info">
      <h4>Funny animals</h4>
      <p>Pop Culture <i class="fa-solid fa-circle-check" style="color: #e60023; font-size: 10px;"></i></p>
    </div>
  </div>
</div>

<div class="container" id="container">
  <div class="coluna" id="col1"></div>
  <div class="coluna" id="col2"></div>
  <div class="coluna" id="col3"></div>
  <div class="coluna" id="col4"></div>
</div>

<nav class="mobile-navbar">
  <div class="nav-item" onclick="location.href='catsterest.html'"><i class="fa-solid fa-house"></i></div>
  <div class="nav-item active" onclick="location.href='busca.html'"><i class="fa-solid fa-magnifying-glass"></i></div>
  <div class="nav-item"><i class="fa-solid fa-plus"></i></div>
  <div class="nav-item" onclick="location.href='mensagens.html'"><i class="fa-solid fa-comment-dots"></i></div>
  <div class="nav-item">
    <div class="profile-pic-small">
      <img src="https://cataas.com/cat?width=30" alt="Perfil">
    </div>
  </div>
</nav>

<script>
// Pega o termo da URL para mostrar no input
const params = new URLSearchParams(window.location.search);
const busca = params.get('q');
if (busca) {
  document.getElementById('inputResultado').value = busca;
}

let aguardando = false;
let proximaColuna = 0;

function addCard() {
  const colunas = [
    document.getElementById("col1"),
    document.getElementById("col2"),
    document.getElementById("col3"),
    document.getElementById("col4")
  ];

  const colunasVisiveis = colunas.filter(col => getComputedStyle(col).display !== "none");
  if (proximaColuna >= colunasVisiveis.length) proximaColuna = 0;
  const colunaAlvo = colunasVisiveis[proximaColuna];
  proximaColuna++;

  const card = document.createElement("div");
  card.className = "card";
  const img = new Image();
  img.src = `https://cataas.com/cat?width=350&nocache=${Math.random()}`;

  img.onload = () => {
    card.appendChild(img);
    colunaAlvo.appendChild(card);
    setTimeout(() => { img.style.opacity = 1; }, 50);
  };
}

function carregarLote(qtd) {
  for (let i = 0; i < qtd; i++) { addCard(); }
}

carregarLote(12);

window.addEventListener('scroll', () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1000) {
    if (!aguardando) {
      aguardando = true;
      carregarLote(6);
      setTimeout(() => { aguardando = false; }, 800); 
    }
  }
});
</script>

</body>
</html>
