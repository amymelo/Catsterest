<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>TicTacMiau</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .topo-title {
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(#fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            margin-bottom: 30px;
        }

        /* PLACAR */
        .scoreboard {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .player-info { text-align: center; }
        .player-info i { display: block; font-size: 2rem; margin-bottom: 5px; }
        .p1 { color: #F4893F; } /* Gato Laranja/Branco */
        .p2 { color: #b3e2ff; } /* Gato Azul/Preto */

        /* TABULEIRO */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: #222;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: #111;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .cell:hover { background-color: #1a1a1a; }
        .cell:active { transform: scale(0.9); }

        /* ÍCONES */
        .fa-cat-p1 { color: #F4893F; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .fa-cat-p2 { color: #b3e2ff; animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes pop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* MENSAGEM DE VITÓRIA */
        #status {
            margin-top: 30px;
            font-size: 1.5rem;
            height: 40px;
            font-weight: 600;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #e60023; color: #fff; }

    </style>
</head>
<body>

    <h1 class="topo-title">MicMacMiau</h1>

    <div class="scoreboard">
        <div class="player-info p1">
            <i class="fa-solid fa-cat"></i>
            <div id="wins-p1">0</div>
        </div>
        <div class="player-info p2">
            <i class="fa-solid fa-cat"></i>
            <div id="wins-p2">0</div>
        </div>
    </div>

    <div class="board" id="board">
        <div class="cell" onclick="makeMove(this, 0)"></div>
        <div class="cell" onclick="makeMove(this, 1)"></div>
        <div class="cell" onclick="makeMove(this, 2)"></div>
        <div class="cell" onclick="makeMove(this, 3)"></div>
        <div class="cell" onclick="makeMove(this, 4)"></div>
        <div class="cell" onclick="makeMove(this, 5)"></div>
        <div class="cell" onclick="makeMove(this, 6)"></div>
        <div class="cell" onclick="makeMove(this, 7)"></div>
        <div class="cell" onclick="makeMove(this, 8)"></div>
    </div>

    <div id="status">Vez do Gato Laranja 🐾</div>

    <button onclick="resetBoard()">Reiniciar Partida</button>

    <script>
        let currentPlayer = 'p1';
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let winsP1 = 0;
        let winsP2 = 0;
        let active = true;

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Horizontais
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Verticais
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        const statusDisplay = document.getElementById('status');

        function makeMove(cell, index) {
            if (gameState[index] !== "" || !active) return;

            gameState[index] = currentPlayer;
            
            if (currentPlayer === 'p1') {
                cell.innerHTML = '<i class="fa-solid fa-cat fa-cat-p1"></i>';
                checkWinner();
                if(active) {
                    currentPlayer = 'p2';
                    statusDisplay.innerText = "Vez do Gato Azul 🐾";
                }
            } else {
                cell.innerHTML = '<i class="fa-solid fa-cat fa-cat-p2"></i>';
                checkWinner();
                if(active) {
                    currentPlayer = 'p1';
                    statusDisplay.innerText = "Vez do Gato Laranja 🐾";
                }
            }
        }

        function checkWinner() {
            let roundWon = false;
            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusDisplay.innerText = `O Gato ${currentPlayer === 'p1' ? 'Laranja' : 'Azul'} Venceu! 🎉`;
                if(currentPlayer === 'p1') winsP1++; else winsP2++;
                updateScore();
                active = false;
                return;
            }

            if (!gameState.includes("")) {
                statusDisplay.innerText = "Empate!";
                active = false;
            }
        }

        function updateScore() {
            document.getElementById('wins-p1').innerText = winsP1;
            document.getElementById('wins-p2').innerText = winsP2;
        }

        function resetBoard() {
            gameState = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = 'p1';
            active = true;
            statusDisplay.innerText = "Vez do Gato Laranja 🐾";
            document.querySelectorAll('.cell').forEach(cell => cell.innerHTML = "");
        }
  
  
  
  function makeMove(cell, index) {
    if (gameState[index] !== "" || !active || currentPlayer === 'p2') return;

    // Jogada do Humano (Gato Laranja)
    executeMove(cell, index, 'p1');

    if (active) {
        currentPlayer = 'p2';
        statusDisplay.innerText = "Bot: Pensando... 🤔";
        setTimeout(iaMove, 600); // Dá um delay para parecer que a IA está pensando
    }
}

function executeMove(cell, index, player) {
    gameState[index] = player;
    cell.innerHTML = `<i class="fa-solid fa-cat fa-cat-${player}"></i>`;
    checkWinner();
}

function iaMove() {
    if (!active) return;

    // 1. Tentar ganhar ou 2. Bloquear o jogador
    let move = findBestMove('p2') || findBestMove('p1');

    // 3. Se não tiver jogada óbvia, tenta o centro ou aleatório
    if (move === null) {
        if (gameState[4] === "") move = 4;
        else {
            const available = gameState.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            move = available[Math.floor(Math.random() * available.length)];
        }
    }

    const cells = document.querySelectorAll('.cell');
    executeMove(cells[move], move, 'p2');

    if (active) {
        currentPlayer = 'p1';
        statusDisplay.innerText = "Sua vez! 🐾";
    }
}

function findBestMove(player) {
    for (let i = 0; i < winningConditions.length; i++) {
        const [a, b, c] = winningConditions[i];
        const values = [gameState[a], gameState[b], gameState[c]];
        
        // Se duas células estão preenchidas pelo mesmo jogador e a terceira está vazia
        if (values.filter(v => v === player).length === 2 && values.includes("")) {
            if (gameState[a] === "") return a;
            if (gameState[b] === "") return b;
            if (gameState[c] === "") return c;
        }
    }
    return null;
}
    </script>
</body>
</html>
