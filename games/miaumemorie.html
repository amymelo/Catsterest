<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Miau Memory - Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        
        body {
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex; 
            flex-direction: column;
            align-items: center;
            min-height: 100vh; 
            padding: 20px;
            padding-top: 100px
            
        }

        .topo-title {
            font-size: 2rem; 
            letter-spacing: 5px; 
            text-transform: uppercase;
            background: linear-gradient(#fff, #444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900; 
            margin-bottom: 5px;
        }

        .hud {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-family: monospace; 
            font-size: 1rem; c
            olor: #777;
        }
        #moves {
            color: #F4893F;
            font-weight: bold; }

        .memory-game {
            display: grid;
            grid-template-columns:
            repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        .card {
            aspect-ratio: 1/1;
            cursor: pointer;
            perspective: 1000px;
            position: relative;
        }

        .card-inner {
            position: relative;
            width: 100%; 
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flip .card-inner { 
            transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex; 
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border: 2px solid #333;
        }

        /* Verso (O QUE VOCÊ VÊ ANTES DE CLICAR) */
        .card-back {
            background-color: #1a1a1a;
            color: #333;
            font-size: 1.8rem;
        }

        /* Frente  (O ÍCONE REVELADO) */
        .card-front {
            background-color: #F4893F;
            color: #000;
            font-size: 2.2rem;
            transform: rotateY(180deg);
        }

        .card.matched .card-front {
            background-color: #fff;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        #win-msg {
            display: none;
            position: fixed; 
            inset: 0;
            background: rgba(0,0,0,0.9);
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            z-index: 100;
        }

        button {
            margin-top: 20px; 
            padding: 12px 35px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 30px; 
            font-weight: bold; 
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    
    <h1 class="topo-title">Miau Memory</h1>

    <div class="hud">
        <div>CHANCES: <span id="moves">0</span></div>
        <div>BEST: <span id="best">--</span></div>
    </div>

    <div class="memory-game" id="game-board"></div>

    <div id="win-msg">
        <h2 style="font-size: 3rem;">PUUURFECT!</h2>
        <p id="final-stats" style="color: #777; margin-top: 10px;"></p>
        <button onclick="resetGame()">Jogar de novo</button>
        
    </div>

    <script>
        const board = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const bestDisplay = document.getElementById('best');
        const winMsg = document.getElementById('win-msg');

        // Ícones da versão Free do Font Awesome
        const catIcons = [
            'fa-cat', 'fa-fish', 'fa-paw', 'fa-bone',
            'fa-shrimp', 'fa-ghost', 'fa-bolt', 'fa-heart'
        ];
        
        let cards = [...catIcons, ...catIcons];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isLocked = false;
        let bestScore = localStorage.getItem('miau_memory_hi') || "--";

        bestDisplay.innerText = bestScore;

        function createBoard() {
            board.innerHTML = "";
            const shuffled = cards.sort(() => Math.random() - 0.5);
            
            shuffled.forEach(icon => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-inner" data-icon="${icon}">
                        <div class="card-back"><i class="fa-solid fa-paw"></i></div>
                        <div class="card-front"><i class="fa-solid ${icon}"></i></div>
                    </div>
                `;
                card.onclick = () => flipCard(card);
                board.appendChild(card);
            });
        }

        function flipCard(card) {
            if (isLocked || card.classList.contains('flip') || card.classList.contains('matched')) return;

            card.classList.add('flip');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isLocked = true;
            const [c1, c2] = flippedCards;
            const icon1 = c1.querySelector('.card-inner').dataset.icon;
            const icon2 = c2.querySelector('.card-inner').dataset.icon;

            if (icon1 === icon2) {
                c1.classList.add('matched');
                c2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];
                isLocked = false;
                if (matchedPairs === catIcons.length) endGame();
            } else {
                setTimeout(() => {
                    c1.classList.remove('flip');
                    c2.classList.remove('flip');
                    flippedCards = [];
                    isLocked = false;
                }, 800);
            }
        }

        function endGame() {
            setTimeout(() => {
                winMsg.style.display = 'flex';
                document.getElementById('final-stats').innerText = `Você completou em ${moves} jogadas!`;
                
                if (bestScore === "--" || moves < bestScore) {
                    bestScore = moves;
                    localStorage.setItem('miau_memory_hi', bestScore);
                    bestDisplay.innerText = bestScore;
                }
            }, 500);
        }

        function resetGame() {
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isLocked = false;
            movesDisplay.innerText = "0";
            winMsg.style.display = 'none';
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
